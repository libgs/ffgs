# Release notes for the GitHub release of a tag, generated from the conventional
# commits since the previous tag (see .github/workflows/release.yml). Preview:
#   uvx git-cliff --latest          # the notes of the latest tag
#   uvx git-cliff --unreleased      # what the next tag would get

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor -%}
{% if previous.version and version -%}
**Full changelog**: https://github.com/libgs/ffgs/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(ci|test|style|build)", skip = true },
  { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
