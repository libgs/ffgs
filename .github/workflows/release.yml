name: Release

# Pushing a tag vX.Y.Z... publishes that commit: CI, then the build, then TestPyPI,
# then PyPI. Both indexes use trusted publishing (no tokens); each publish job runs
# in a GitHub environment of the same name, where a required reviewer can hold it.
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag against the version
        run: |
          version=$(uv run --no-project --python 3.12 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      # The wheel, not the checkout: CPU torch first, as in CI.
      - name: Import the built wheel
        run: |
          uv venv /tmp/wheel-env --python 3.12
          VIRTUAL_ENV=/tmp/wheel-env uv pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c \
            "import ffgs, ffgs.zoo; print(ffgs.__file__); print(ffgs.zoo.list_models())"
          /tmp/wheel-env/bin/python -c \
            "import ffgs; assert ffgs.__version__ == '${GITHUB_REF_NAME#v}', ffgs.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ffgs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ffgs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
