name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # The release workflow runs it on the tagged commit first.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv run --only-group dev ruff check --no-fix .
      - run: uv run --only-group dev black --check .

  test:
    # No GPU here: CPU torch is installed first so the default (CUDA) wheels from
    # PyPI are never pulled; tests marked `gpu` skip.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python-version }}
      - run: >-
          uv pip install torch torchvision
          --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . --group dev
      - run: uv run --no-sync pytest
